apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "olympus-service.fullname" . }}
  labels:
    {{- include "olympus-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "olympus-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.olympus.consoles }}
        # Roll the pods when the registry changes — otherwise a config-only edit
        # leaves the old list serving until something else restarts it.
        checksum/registry: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "olympus-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: OLYMPUS_HTTP_PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: OLYMPUS_DOMAIN
              value: {{ .Values.olympus.domain | quote }}
            - name: OLYMPUS_HEALTH_TIMEOUT
              value: {{ .Values.olympus.health.timeout | quote }}
            {{- if .Values.olympus.consoles }}
            - name: JAVA_OPTS
              value: "-Dconfig.file=/etc/olympus/override.conf"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # /health is this service's OWN liveness. Never probe /health/consoles:
          # a console being down would restart Olympus, which is not the problem.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.olympus.consoles }}
            - name: registry
              mountPath: /etc/olympus
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.olympus.consoles }}
        - name: registry
          configMap:
            name: {{ include "olympus-service.fullname" . }}-registry
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

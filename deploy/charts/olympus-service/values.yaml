replicaCount: 1

image:
  # NOTE: the Docker Hub account is `calvinference`, NOT the GitHub org.
  repository: calvinference/olympusservice
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# This service is INTERNAL: only olympus-ui's BFF talks to it. It gets no ingress
# by default and should not need one — exposing it would put the registry and the
# in-cluster probe targets on the network for no gain.
ingress:
  enabled: false
  # Load-bearing empty string, same as olympus-ui: the template omits the field
  # entirely when empty, because "" is RFC-1123-invalid and k8s rejects the object.
  className: ""
  annotations: {}
  hosts: []
  clusterIssuer: ""
  tlsSecretName: ""

olympus:
  domain: home.experimentalneutron.com

  # codex's status-of-record manifest, rendered by the Olympus board.
  #
  # The ConfigMap is OWNED BY CODEX (generated from constellation.yaml and
  # re-applied whenever it changes) — this chart mounts it, never creates it. The
  # mount is optional on purpose: a missing manifest must degrade to a board that
  # says so, not a service that will not start.
  #
  # Set `source` to an http(s) URL to fetch instead of mounting — that is the Iris
  # path once the contracts live in the Obsidian vault
  # (proposed: Atlas/Olympus/Contracts/constellation.yaml). It takes precedence.
  constellation:
    configMapName: constellation-manifest
    key: constellation.yaml
    mountPath: /etc/olympus
    source: ''
  health:
    timeout: 3s
  # Override the whole registry here when it drifts from the image default.
  # Rendered into a ConfigMap and layered over application.conf.
  consoles: []

extraEnv: []

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 512Mi

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

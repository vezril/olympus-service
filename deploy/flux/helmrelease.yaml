# REFERENCE ONLY. The authoritative record of what is deployed lives in codex
# `apps/olympus/` (there is no Flux on this cluster; deploys are a manual
# `helm upgrade` from the tagged chart). Keep this in step with that, or delete it
# rather than let it drift into a second, wrong source of truth.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: olympus-service
  namespace: olympus
spec:
  interval: 10m
  url: https://github.com/vezril/olympus-service
  ref:
    tag: v0.1.1
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: olympus-service
  namespace: olympus
spec:
  interval: 10m
  chart:
    spec:
      chart: deploy/charts/olympus-service
      sourceRef:
        kind: GitRepository
        name: olympus-service
        namespace: olympus
  values:
    image:
      repository: calvinference/olympusservice
      tag: "0.1.1"

    # Internal only. olympus-ui reaches it at
    # http://olympus-service.olympus.svc.cluster.local
    ingress:
      enabled: false

    olympus:
      domain: home.experimentalneutron.com
      health:
        timeout: 3s

olympus {
  http {
    host = "0.0.0.0"
    host = ${?OLYMPUS_HTTP_HOST}
    port = 8080
    port = ${?OLYMPUS_HTTP_PORT}
  }

  # Public name each console is reachable at, behind Authelia at the Traefik edge.
  domain = "home.experimentalneutron.com"
  domain = ${?OLYMPUS_DOMAIN}

  health {
    # Per-probe budget. The aggregate call cannot outlast this by much.
    timeout = 3 seconds
    timeout = ${?OLYMPUS_HEALTH_TIMEOUT}
  }

  # The registry. Static config today; the codex apps/ dir is what it mirrors.
  #
  # namespace/service/port are VERIFIED against the live cluster (kubectl get svc,
  # 2026-08-26), not guessed from the god's name. The earlier guess of
  # <god>-ui.<god> was wrong for four of five consoles and would have reported
  # the whole constellation Down.
  #
  # href defaults to https://<id>.<domain>; health-url defaults to
  # http://<service>.<namespace>.svc.cluster.local:<port>/ — GET / on the
  # console's own Service, which is exactly what its readiness probe answers.
  # port defaults to 80.
  consoles = [
    {
      id = "dionysus"
      name = "Dionysus"
      blurb = "The flagship planner."
      namespace = "default"
      service = "dionysus-planner"
      port = 3000
      accent = "oklch(0.85 0.2 195)"
      accent-alt = "oklch(0.7 0.28 340)"
      status = "live"
    }
    {
      id = "hermes"
      name = "Hermes"
      blurb = "Messaging and delivery."
      namespace = "hermes-ui"
      service = "hermes-hermes"
      accent = "oklch(0.8 0.25 145)"
      status = "live"
    }
    {
      id = "apollo"
      name = "Apollo"
      blurb = "Insight and forecasting."
      namespace = "apollo-ui"
      service = "apollo"
      accent = "oklch(0.9 0.12 95)"
      status = "live"
    }
    {
      id = "artemis"
      name = "Artemis"
      blurb = "Tracking and retrieval."
      namespace = "artemis-ui"
      service = "artemis-ui-artemis-ui"
      accent = "oklch(0.87 0.03 260)"
      status = "live"
    }
    {
      id = "demeter"
      name = "Demeter"
      blurb = "Yields and market prices."
      namespace = "demeter"
      service = "demeter-ui"
      port = 3000
      accent = "oklch(0.8 0.16 85)"
      status = "live"
    }
    {
      id = "hephaestus"
      name = "Hephaestus"
      blurb = "Builds and the forge."
      namespace = "hephaestus-ui"
      service = "hephaestus-ui"
      accent = "oklch(0.7 0.22 35)"
      status = "live"
    }
    {
      id = "hera"
      name = "Hera"
      blurb = "Not yet built."
      namespace = "hera"
      service = "hera-ui"
      accent = "oklch(0.78 0.1 25)"
      status = "planned"
    }
    {
      id = "poseidon"
      name = "Poseidon"
      blurb = "Not yet built."
      namespace = "poseidon"
      service = "poseidon-ui"
      accent = "oklch(0.65 0.19 255)"
      status = "planned"
    }
    {
      id = "ares"
      name = "Ares"
      blurb = "Not yet built."
      namespace = "ares"
      service = "ares-ui"
      accent = "oklch(0.6 0.23 20)"
      status = "planned"
    }
  ]
}

pekko {
  loglevel = "INFO"
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

  http.host-connection-pool {
    # Consoles are few and probes are short-lived; keep the pool small.
    max-connections = 4
    max-open-requests = 32
  }
}
